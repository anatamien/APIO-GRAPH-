name: Build Windows offline installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup default 1.99.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repository
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build without local profile paths
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "--remap-path-prefix=$env:USERPROFILE=/build-user --remap-path-prefix=$($PWD.Path)=/apio-graph"
          pnpm tauri build --ci --bundles nsis -- --locked
      - name: Prepare download and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-artifacts | Out-Null
          Copy-Item -LiteralPath 'src-tauri/target/release/bundle/nsis/APIO GRAPH_1.3.4_x64-setup.exe' -Destination 'release-artifacts/APIO-GRAPH-1.3.4-windows-x64-offline-setup.exe'
          $artifact = Get-Item -LiteralPath 'release-artifacts/APIO-GRAPH-1.3.4-windows-x64-offline-setup.exe'
          $checksum = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath release-artifacts/SHA256SUMS.txt -Encoding utf8 -Value "$checksum  $($artifact.Name)"
      - uses: actions/upload-artifact@v4
        with:
          name: APIO-GRAPH-1.3.4-windows-x64-offline
          path: release-artifacts/
          retention-days: 14
