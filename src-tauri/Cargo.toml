[package]
name = "apio-graph"
version = "1.2.0"
license = "GPL-3.0-only"
description = "APIO GRAPH scientific graph editor"
edition = "2021"
rust-version = "1.90"

[lib]
name = "apio_graph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
percent-encoding = "=2.3.2"
tempfile = "=3.27.0"
sha2 = "=0.10.9"
crc32fast = "=1.5.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
